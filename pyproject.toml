[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsdeals-river"
version = "0.3.0"
description = "Python SDK for consuming the Kit's Deals river — real-time, structured, agent-friendly deal events"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Paraffin Endeavors" }]
keywords = ["kitsdeals", "deals", "sse", "agent", "river"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.25",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://kitsdeals.com"
Documentation = "https://api.kitsdeals.com/v1/river/guide"
Repository = "https://github.com/paraffinendeavors/kitsdeals-river"
Issues = "https://github.com/paraffinendeavors/kitsdeals-river/issues"

[project.scripts]
kitsdeals-river = "kitsdeals_river.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
