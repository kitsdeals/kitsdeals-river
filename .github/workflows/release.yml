name: Release to PyPI

# Triggered when a v* tag lands on the public repo (the dealer release
# script pushes the tag after the subtree split). Builds the wheel +
# sdist and publishes to PyPI.
#
# Required secret: PYPI_API_TOKEN  (PyPI account token, scoped to
# kitsdeals-river when possible).

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build + publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Tag matches: v$TAG_VERSION"

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
